<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1 class="header__logo">ShopSmart</h1>

        <nav class="header__nav">
            <a href="#" class="header__link">Home</a>
            <a href="#products" class="header__link">Products</a>
            <a href="#cart" class="header__link">Cart</a>
        </nav>

        <button class="header__cart-button" id="cartButton">
            Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="shop">

        <aside class="sidebar">
            <h2 class="sidebar__title">Filters</h2>

            <label class="sidebar__label" for="categoryFilter">
                Category
            </label>

            <select class="sidebar__select" id="categoryFilter">
                <option value="all">All Products</option>
                <option value="beauty">Beauty</option>
                <option value="fragrances">Fragrances</option>
                <option value="furniture">Furniture</option>
                <option value="groceries">Groceries</option>
            </select>

            <label class="sidebar__label" for="sortFilter">
                Sort By
            </label>

            <select class="sidebar__select" id="sortFilter">
                <option value="default">Default</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>
        </aside>

        <section class="products" id="products">
            <div class="products__header">
                <h2 class="products__title">Our Products</h2>

                <input
                    type="search"
                    class="products__search"
                    id="searchInput"
                    placeholder="Search products..."
                    aria-label="Search products"
                >
            </div>

            <div class="products__grid" id="productsGrid"></div>
        </section>

    </main>

    <section class="cart" id="cart">
        <h2 class="cart__title">Your Shopping Cart</h2>

        <div class="cart__items" id="cartItems">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart__summary">
            <p>
                Total Items:
                <span id="totalItems">0</span>
            </p>

            <p>
                Total Price:
                ₹<span id="totalPrice">0.00</span>
            </p>

            <button class="cart__checkout" id="checkoutButton">
                Checkout
            </button>

            <p class="cart__message" id="cartMessage" aria-live="polite"></p>
        </div>
    </section>

    <footer class="footer">
        <p class="footer__text">
            © 2026 ShopSmart. All rights reserved.
        </p>
    </footer>

</body>
</html>
